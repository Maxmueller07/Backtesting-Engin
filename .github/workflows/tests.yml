name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check ignored local files are not tracked
        run: |
          tracked="$(git ls-files .env .env.txt backtesting.db '*.db' '*.sqlite' '*.sqlite3')"
          if [ -n "$tracked" ]; then
            echo "Local/secret files are tracked:"
            echo "$tracked"
            exit 1
          fi

      - name: Secret pattern scan
        run: |
          python - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          patterns = {
              "github_pat": re.compile("github_" + "pat_"),
              "github_classic": re.compile("gh" + "p_"),
              "tavily": re.compile("tv" + "ly-"),
              "openai": re.compile("sk" + "-[A-Za-z0-9]"),
          }
          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          hits = []
          for file in files:
              if pathlib.Path(file).suffix.lower() in {".db", ".sqlite", ".sqlite3"}:
                  continue
              try:
                  text = pathlib.Path(file).read_text(encoding="utf-8", errors="ignore")
              except OSError:
                  continue
              for name, pattern in patterns.items():
                  if file == "tests/test_deployment_files.py" and name == "tavily":
                      continue
                  if pattern.search(text):
                      hits.append(f"{file}: {name}")
          if hits:
              print("Secret-like patterns found:")
              print("\n".join(hits))
              sys.exit(1)
          PY

      - name: Run unittest suite
        run: python -m unittest discover -s tests -v

      - name: Build Docker sandbox
        run: docker build -t backtesting-rule-sandbox .

      - name: Run Docker sandbox smoke test
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --memory 512m \
            --cpus 1 \
            backtesting-rule-sandbox
