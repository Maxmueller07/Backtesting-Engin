services:
  rule-sandbox:
    build: .
    command: python sandbox_runner.py --self-test --strict-no-secrets
    network_mode: "none"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
